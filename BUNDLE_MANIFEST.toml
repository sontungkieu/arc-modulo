schema_version = 1
created = "2026-08-15"
python = "3.10"
environment_manager = "uv"
layout = "thin main suite plus four history-preserving paper branches"

[included]
upstream_snapshots = false
upstream_git_history = "paper branches"
upstream_bootstrap = "scripts/bootstrap_upstreams.py"
frozen_lockfiles = 3
runner_wrappers = true
machine_readable_results = true
report_latex_and_pdf = true
slides_source_pdf_and_vi_script = true
metric_explainer = true
full_local_zip = "diffusion-smc-repro-friend-kit-20260815.zip contains tracked source snapshots"

[excluded]
secrets = true
physical_virtualenvs = true
model_caches = true
bulk_remote_outputs = true
third_party_paper_pdfs = true

[notes]
fk_steering_submodule = "not embedded on main; preserved as gitlink on paper/fk-steering and not needed by executed text-to-image scope"

