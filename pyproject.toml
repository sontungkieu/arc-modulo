[project]
name = "diffusion-smc-repro"
version = "0.1.0"
description = "Portable uv environment and provenance wrappers for four diffusion SMC reproductions"
requires-python = ">=3.10,<3.11"
dependencies = [
    "einops==0.8.0",
    "hydra-core==1.3.2",
    "ipykernel==6.29.5",
    "lightning==2.4.0",
    "matplotlib==3.9.4",
    "nbclient==0.10.2",
    "nbformat==5.10.4",
    "numba==0.60.0",
    "numpy==1.26.4",
    "omegaconf==2.3.0",
    "pandas==2.2.3",
    "pillow==11.1.0",
    "pot==0.9.5",
    "scikit-learn==1.5.2",
    "scipy==1.13.1",
    "rich==13.9.4",
    "setuptools==80.9.0",
    "torch==2.4.0",
    "torchdiffeq==0.2.5",
    "torchmetrics==0.11.4",
    "torchsde==0.2.6",
    "torchvision==0.19.0",
    "tomli==2.2.1",
    "tqdm==4.67.1",
    "wandb==0.17.9",
]

[tool.uv]
package = false
