[project]
name = "null-tta-reproduction"
version = "0.1.0"
description = "Portable uv environment for the official Null-TTA CVPR 2026 code"
requires-python = ">=3.10,<3.11"
dependencies = [
    "absl-py==2.1.0",
    "accelerate==1.3.0",
    "clip==0.2.0",
    "diffusers==0.32.2",
    "hpsv2==1.2.0",
    "huggingface-hub==0.28.1",
    "image-reward==1.5",
    "inflect==7.5.0",
    "lpips==0.1.4",
    "matplotlib==3.10.5",
    "ml-collections==0.1.1",
    "numba==0.60.0",
    "numpy==2.0.0",
    "pyarrow==20.0.0",
    "pydantic==2.10.6",
    "scipy==1.14.0",
    "setuptools==80.9.0",
    "timm==1.0.14",
    "torch==2.3.1",
    "torchvision==0.18.1",
    "transformers==4.48.2",
    "wandb==0.17.9",
]

[tool.uv]
package = false
override-dependencies = [
    # Null-TTA pins timm 1.0.14; ImageReward 1.5 declares 0.6.13 even though
    # it is only an evaluation scorer in the PickScore experiment.
    "timm==1.0.14",
]
